name: Build real walking routes

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build routes via OSRM
        run: python3 tools/build_routes.py

      # 一部のペア取得に失敗してジョブが失敗扱いになっても、取得済み分は保存して次回の再開に使う
      - name: Commit and push
        if: always()
        run: |
          git config user.name "tokyo-yosakoi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/routes.json data/walktimes.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: build real walking routes via OSRM"
            git push
          fi

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>東京よさこいナビ 2026</title>
<meta name="description" content="第27回東京よさこい2026 非公式ナビゲーター">
<meta name="theme-color" content="#a8241f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
<script>
  try {
    var s = JSON.parse(localStorage.getItem("tyk.settings.v1") || "{}");
    if (s.fontSize === "large") document.documentElement.classList.add("font-large");
    if (s.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    if (s.theme === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <header id="app-header">
    <div class="brand">
      <span class="brand-mark">&#127881;</span>
      <div class="brand-text">
        <span class="brand-name">東京よさこいナビ</span>
        <span class="brand-sub" id="header-updated"></span>
      </div>
    </div>
    <div class="header-actions">
      <button id="btn-changelog" class="icon-btn" aria-label="更新履歴" title="更新履歴">&#128226;</button>
      <button id="btn-settings" class="icon-btn" aria-label="設定" title="設定">&#9881;&#65039;</button>
    </div>
  </header>

  <main id="main" aria-live="polite"></main>

  <nav id="tabbar">
    <button class="tab-btn" data-tab="now" aria-label="演舞中">
      <span class="tab-icon">&#128131;</span><span class="tab-label">演舞中</span>
    </button>
    <button class="tab-btn" data-tab="artists" aria-label="参加チーム">
      <span class="tab-icon">&#128197;</span><span class="tab-label">参加チーム</span>
    </button>
    <button class="tab-btn" data-tab="map" aria-label="マップ">
      <span class="tab-icon">&#128506;&#65039;</span><span class="tab-label">マップ</span>
    </button>
    <button class="tab-btn" data-tab="mytt" aria-label="マイタイムテーブル">
      <span class="tab-icon">&#9733;</span><span class="tab-label">マイタイムテーブル</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => reg.update().catch(() => {})).catch(() => {});
    });
  }
</script>
</body>
</html>
